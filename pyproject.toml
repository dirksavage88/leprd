[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekf2-playback-review"
version = "0.1.0"
description = "Generate PX4 EKF2 replay review plots and LaTeX reports from ULog files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pyulog>=1.0",
  "pyyaml>=6.0.3",
  "scipy>=1.17.1",
]

[project.scripts]
ekf2-review = "ekf2_playback_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
